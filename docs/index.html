<!doctype html>
<html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ખાતાવહી - Khata Book</title>
<style>
:root{--c:#1E9E63;--g:#1E9E63;--r:#D64545;--ink:#1b1b1f;--mut:#6b6b76;--bg:#f4f6f5}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Gujarati",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{background:var(--c);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0;flex:1}header button{background:#fff3;border:0;color:#fff;padding:8px 12px;border-radius:10px;font-size:14px}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.big{font-weight:700}.muted{color:var(--mut);font-size:13px}
.in{color:var(--g);font-weight:700}.out{color:var(--r);font-weight:700}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--c);color:#fff;font-size:16px;font-weight:600;margin-top:8px}.btn.grey{background:#eceef0;color:var(--ink)}.btn.red{background:var(--r)}
input,select{width:100%;padding:12px;border:1px solid #d9dde0;border-radius:10px;font-size:16px;margin-top:8px;background:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e3e6e8;padding:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;padding:9px 2px;border-radius:10px;font-size:12px;color:var(--mut)}nav button.on{background:var(--c);color:#fff}
.x{border:0;background:none;color:#aaa;font-size:18px}
.pill{font-size:12px;padding:3px 8px;border-radius:99px;background:#eef6f1;color:var(--g)}.pill.late{background:#fde8e8;color:var(--r)}
.sum{display:flex;gap:8px}.sum div{flex:1;border-radius:14px;padding:12px;text-align:center;color:#fff}
.bar{height:12px;border-radius:6px;background:#e6e9ea;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--g)}
.lbl{font-size:13px;color:var(--mut);margin-top:10px}
#lock{position:fixed;inset:0;background:var(--c);color:#fff;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#lock input{max-width:220px;text-align:center;font-size:26px;letter-spacing:8px}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}main{max-width:none}}

body.dark{--bg:#111315;--ink:#eceef0;--mut:#9aa1a8}
body.dark .card,body.dark nav{background:#1c1f22}
body.dark input,body.dark select{background:#14171a;color:#eceef0;border-color:#3a3f44}
body.dark .btn.grey{background:#2b2f33;color:#eceef0}
body.dark .bar{background:#2b2f33}body.dark .pill{background:#25302a}
body.dark .card[style*="fff4e5"]{background:#3a2e1c!important}
body.dark nav{border-top-color:#2b2f33}
body.bold,body.bold input,body.bold select,body.bold button{font-weight:700}
body.hc{--mut:#3a3f47}body.dark.hc{--mut:#d5d9df}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;padding:0}.sw button.on{border-color:var(--ink)}
.chk{display:flex;align-items:center;gap:10px;margin:8px 0}.chk input{width:22px;height:22px;margin:0}
</style></head><body>

function t(k){return T[k]?T[k][gu?0:1]:k}

function blank(){return{entries:[],people:[],budgets:{},settings:{lang:"gu"},updated:0}}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function load(){try{S=JSON.parse(localStorage.getItem(LS))||blank()}catch(e){S=blank()}
 ["entries","people"].forEach(function(k){if(!Array.isArray(S[k]))S[k]=[]});S.settings=Object.assign(blank().settings,S.settings||{});gu=S.settings.lang!=="en"}
function save(){S.updated=Date.now();localStorage.setItem(LS,JSON.stringify(S));push()}
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function el(h){var d=document.createElement("div");d.innerHTML=h;return d.firstChild}
function money(n){var a=Math.abs(Math.round(n)),q=a%100,s=String(Math.floor(a/100)),l=s.slice(-3),r=s.slice(0,-3);if(r)l=r.replace(/\B(?=(\d{2})+(?!\d))/g,",")+","+l;return (n<0?"-":"")+l+(q?"."+("0"+q).slice(-2):"")}
function paise(v){var x=parseFloat(String(v).replace(/,/g,""));return x>0?Math.round(x*100):0}

function dstr(ts){return new Date(ts).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}
function sameMonth(ts,off){var a=new Date(ts),n=new Date();n.setDate(1);n.setMonth(n.getMonth()-(off||0));return a.getFullYear()===n.getFullYear()&&a.getMonth()===n.getMonth()}
function bal(p){return p.tx.reduce(function(b,x){return b+(x.type==="gave"?x.amt:-x.amt)},0)}
function startOfToday(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function dueList(){var out=[],end=startOfToday()+864e5;S.people.forEach(function(p){if(bal(p)<=0)return;p.tx.forEach(function(x){if(x.type==="gave"&&x.due&&x.due<end&&!x.paid)out.push({p:p,x:x})})});return out}
