<!doctype html>
<html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E9E63"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png">
<title>ખાતાવહી - Khata Book</title>
<style>
:root{--g:#1E9E63;--r:#D64545;--ink:#1b1b1f;--mut:#6b6b76;--bg:#f4f6f5}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Gujarati",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{background:var(--g);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0;flex:1}header button{background:#fff3;border:0;color:#fff;padding:8px 12px;border-radius:10px;font-size:14px}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.big{font-weight:700}.muted{color:var(--mut);font-size:13px}
.in{color:var(--g);font-weight:700}.out{color:var(--r);font-weight:700}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--g);color:#fff;font-size:16px;font-weight:600;margin-top:8px}.btn.grey{background:#eceef0;color:var(--ink)}.btn.red{background:var(--r)}
input,select{width:100%;padding:12px;border:1px solid #d9dde0;border-radius:10px;font-size:16px;margin-top:8px;background:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e3e6e8;padding:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;padding:9px 2px;border-radius:10px;font-size:12px;color:var(--mut)}nav button.on{background:var(--g);color:#fff}
.x{border:0;background:none;color:#aaa;font-size:18px}
.pill{font-size:12px;padding:3px 8px;border-radius:99px;background:#eef6f1;color:var(--g)}.pill.late{background:#fde8e8;color:var(--r)}
.sum{display:flex;gap:8px}.sum div{flex:1;border-radius:14px;padding:12px;text-align:center;color:#fff}
.bar{height:12px;border-radius:6px;background:#e6e9ea;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--g)}
.lbl{font-size:13px;color:var(--mut);margin-top:10px}
#lock{position:fixed;inset:0;background:var(--g);color:#fff;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#lock input{max-width:220px;text-align:center;font-size:26px;letter-spacing:8px}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}main{max-width:none}}
</style></head><body>
<div id="lock"><h2 id="lt"></h2><input id="lp" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><button class="btn" id="lb" style="max-width:220px;background:#fff;color:var(--g)"></button><div id="le" style="margin-top:10px"></div></div>

var CATS=["food","travel","shop","bill","health","other"];
function blank(){return{entries:[],people:[],settings:{lang:"gu"},updated:0}}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function load(){try{S=JSON.parse(localStorage.getItem(LS))||blank()}catch(e){S=blank()}
 ["entries","people"].forEach(function(k){if(!Array.isArray(S[k]))S[k]=[]});S.settings=Object.assign(blank().settings,S.settings||{});gu=S.settings.lang!=="en"}

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function money(n){var s=String(Math.abs(Math.round(n))),l=s.slice(-3),r=s.slice(0,-3);if(r)l=r.replace(/\B(?=(\d{2})+(?!\d))/g,",")+","+l;return (n<0?"-":"")+l}

function dstr(ts){return new Date(ts).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}

 $("#ttl").textContent=t("app");$("#lang").textContent=gu?"English":"ગુજરાતી";

 var m=$("#m");m.innerHTML="";

 m.appendChild(el('<div class="card"><div class="muted">'+t("month")+'</div><div class="sum" style="margin-top:8px"><div style="background:var(--g)"><div>'+t("in")+'</div><div class="big">₹'+money(s.i)+'</div></div><div style="background:var(--r)"><div>'+t("out")+'</div><div class="big">₹'+money(s.o)+'</div></div></div><div style="margin-top:10px;text-align:center" class="big">'+t("bal")+': <span class="'+(s.i-s.o>=0?"in":"out")+'">₹'+money(s.i-s.o)+'</span></div></div>'));
 var f=el('<div class="card"><div class="row"><button class="btn" id="bi">'+t("add_in")+'</button><button class="btn red" id="bo">'+t("add_out")+'</button></div><div id="fm"></div></div>');
 function form(type){var fm=f.querySelector("#fm");fm.innerHTML='<input id="a" type="number" inputmode="decimal" placeholder="'+t("amt")+'">'+(type==="out"?'<select id="c">'+CATS.map(function(c){return'<option value="'+c+'">'+t("c_"+c)+'</option>'}).join("")+'</select>':"")+'<input id="n" placeholder="'+t("note")+'"><button class="btn" id="sv">'+t("save")+'</button>';
  fm.querySelector("#sv").onclick=function(){var a=Math.round(parseFloat(fm.querySelector("#a").value));if(!(a>0))return;var e={id:id(),type:type,amt:a,note:fm.querySelector("#n").value.trim(),ts:Date.now()};if(type==="out")e.cat=fm.querySelector("#c").value;S.entries.push(e);save();render()}}
 f.querySelector("#bi").onclick=function(){form("in")};f.querySelector("#bo").onclick=function(){form("out")};m.appendChild(f);
 var l=S.entries.slice().sort(function(a,b){return b.ts-a.ts}).slice(0,60);if(!l.length)m.appendChild(el('<div class="muted" style="text-align:center">'+t("none")+'</div>'));
 l.forEach(function(e){var c=el('<div class="card row"><div class="muted" style="width:46px">'+day(e.ts)+'</div><div class="grow"><div>'+esc(e.note||(e.cat?t("c_"+e.cat):""))+'</div>'+(e.cat?'<span class="pill">'+t("c_"+e.cat)+'</span>':"")+'</div><div class="'+(e.type==="in"?"in":"out")+'">'+(e.type==="in"?"+":"-")+' ₹'+money(e.amt)+'</div><button class="x">✕</button></div>');
  c.querySelector(".x").onclick=function(){if(ask()){S.entries=S.entries.filter(function(x){return x.id!==e.id});save();render()}};m.appendChild(c)})}
function vUdhar(m){var dl=dueList();
 if(dl.length){var b=el('<div class="card" style="background:#fff4e5"><div class="big">⏰ '+t("dues")+' ('+dl.length+')</div></div>');dl.slice(0,6).forEach(function(d){b.appendChild(el('<div class="muted">'+esc(d.p.name)+' — ₹'+money(d.x.amt)+' • '+dstr(d.x.due)+'</div>'))});m.appendChild(b)}
 var tot=0;S.people.forEach(function(p){tot+=bal(p)});

 var f=el('<div class="card"><input id="pn" placeholder="'+t("pname")+'"><button class="btn">'+t("add_person")+'</button></div>');
 f.querySelector("button").onclick=function(){var n=f.querySelector("#pn").value.trim();if(!n)return;S.people.push({id:id(),name:n,tx:[]});save();render()};m.appendChild(f);

function pById(i){return S.people.filter(function(p){return p.id===i})[0]}
function stmtText(p){var b=bal(p),lines=[(gu?"નમસ્તે ":"Hello ")+p.name+",",(gu?"તમારો હિસાબ:":"Your account:")];p.tx.slice().sort(function(a,b){return a.ts-b.ts}).forEach(function(x){lines.push(dstr(x.ts)+"  "+(x.type==="gave"?"+":"-")+"₹"+money(x.amt)+(x.note?"  "+x.note:""))});
 lines.push(b>0?(gu?"બાકી (તમારે આપવાના): ₹":"Balance due from you: ₹")+money(b):b<0?(gu?"તમને આપવાના: ₹":"We owe you: ₹")+money(-b):(gu?"હિસાબ ચૂકતે ✅":"All settled ✅"));return lines.join("\n")}
function vPerson(m){var p=pById(openP);if(!p){openP=null;return render()}var b=bal(p);
 var bk=el('<button class="btn grey noprint" style="margin:0 0 10px">'+t("back")+'</button>');bk.onclick=function(){openP=null;render()};m.appendChild(bk);
 m.appendChild(el('<div class="card"><div class="big" style="font-size:20px">'+esc(p.name)+'</div><div class="'+(b>=0?"in":"out")+'" style="font-size:22px;font-weight:700">₹'+money(Math.abs(b))+'</div><div class="muted">'+(b>0?t("they_owe"):b<0?t("you_owe"):t("settled"))+'</div></div>'));
 var f=el('<div class="card noprint"><div class="row"><button class="btn red" id="g">'+t("gave")+'</button><button class="btn" id="r">'+t("got")+'</button></div><div id="fm"></div></div>');
 function form(type){var fm=f.querySelector("#fm");fm.innerHTML='<input id="a" type="number" inputmode="decimal" placeholder="'+t("amt")+'"><input id="n" placeholder="'+t("note")+'">'+(type==="gave"?'<div class="lbl">'+t("due")+'</div><input id="d" type="date">':"")+'<button class="btn" id="sv">'+t("save")+'</button>';
  fm.querySelector("#sv").onclick=function(){var a=Math.round(parseFloat(fm.querySelector("#a").value));if(!(a>0))return;var x={id:id(),type:type,amt:a,note:fm.querySelector("#n").value.trim(),ts:Date.now()};var d=fm.querySelector("#d");if(d&&d.value)x.due=new Date(d.value+"T09:00:00").getTime();p.tx.push(x);save();render()}}
 f.querySelector("#g").onclick=function(){form("gave")};f.querySelector("#r").onclick=function(){form("got")};m.appendChild(f);
 var ac=el('<div class="card noprint"><button class="btn" id="wa">'+t("share")+'</button><button class="btn grey" id="pf">'+t("pdf")+'</button></div>');
 ac.querySelector("#wa").onclick=function(){window.open("https://wa.me/?text="+encodeURIComponent(stmtText(p)),"_blank")};
 ac.querySelector("#pf").onclick=function(){window.print()};m.appendChild(ac);
 p.tx.slice().sort(function(a,b){return b.ts-a.ts}).forEach(function(x){var late=x.type==="gave"&&x.due&&x.due<startOfToday()&&b>0;
  var c=el('<div class="card row"><div class="muted" style="width:46px">'+day(x.ts)+'</div><div class="grow"><div>'+esc(x.note||"")+'</div>'+(x.due?'<span class="pill '+(late?"late":"")+'">'+(late?t("late")+" • ":t("due_on")+" ")+dstr(x.due)+'</span>':"")+'</div><div class="'+(x.type==="gave"?"out":"in")+'">₹'+money(x.amt)+'</div><button class="x noprint">✕</button></div>');
  c.querySelector(".x").onclick=function(){if(ask()){p.tx=p.tx.filter(function(y){return y.id!==x.id});save();render()}};m.appendChild(c)});
 var d=el('<button class="btn grey noprint" style="margin-top:6px">'+t("sure").replace("?","")+' ✕</button>');d.onclick=function(){if(ask()){S.people=S.people.filter(function(y){return y.id!==p.id});openP=null;save();render()}};m.appendChild(d)}
function vReport(m){
 var s=sums(0),by={};S.entries.forEach(function(e){if(e.type==="out"&&sameMonth(e.ts,0)){var c=e.cat||"other";by[c]=(by[c]||0)+e.amt}});
 var c1=el('<div class="card"><div class="big">'+t("exp_by")+'</div></div>'),mx=Math.max.apply(null,CATS.map(function(c){return by[c]||0}).concat([1]));

 if(!Object.keys(by).length)c1.appendChild(el('<div class="muted">'+t("none")+'</div>'));m.appendChild(c1);
 var c2=el('<div class="card"><div class="big">'+t("chart")+'</div></div>'),rows=[],mm=1;for(var k=5;k>=0;k--){var q=sums(k),d=new Date();d.setDate(1);d.setMonth(d.getMonth()-k);rows.push({l:d.toLocaleDateString("en-GB",{month:"short"}),q:q});mm=Math.max(mm,q.i,q.o)}
 rows.forEach(function(r){c2.appendChild(el('<div style="margin-top:10px"><div class="muted">'+r.l+'  ₹'+money(r.q.i)+' / ₹'+money(r.q.o)+'</div><div class="bar"><i style="width:'+Math.round(r.q.i*100/mm)+'%"></i></div><div class="bar"><i style="width:'+Math.round(r.q.o*100/mm)+'%;background:var(--r)"></i></div></div>'))});m.appendChild(c2)}
function hash(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode("khata:"+s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")})}

 b.querySelector("#ex").onclick=function(){var u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="khata-backup.json";l.click()};
